[package]
name = "pgvs3"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
object_store = { version = "0.13.2", features = ["aws"] }
sha2 = "0.10"
s3s = "0.16"
# TLS to PostgreSQL (Aurora rejects plaintext): rustls on ring, the provider
# the rest of the tree already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
