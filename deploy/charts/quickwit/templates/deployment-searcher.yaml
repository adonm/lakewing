{{- if gt (int .Values.searcher.replicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit-searcher
spec:
  replicas: {{ .Values.searcher.replicas }}
  selector:
    matchLabels: { app: quickwit-searcher }
  template:
    metadata:
      labels: { app: quickwit-searcher, quickwit-peer: "true" }
    spec:
      containers:
        - name: quickwit
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args: [run, --config, /etc/quickwit/quickwit.yaml]
          env:
            - name: QW_ENABLED_SERVICES
              value: searcher
            - name: QW_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: QW_PEER_SEEDS
              value: quickwit-peers:7280
            - name: QW_METASTORE_URI
              valueFrom:
                secretKeyRef: { name: {{ .Values.metastoreSecretName | quote }}, key: metastoreUrl }
          ports:
            - { containerPort: 7280, name: rest }
            - { containerPort: 7281, name: grpc }
          readinessProbe:
            httpGet: { path: /api/v1/cluster, port: rest }
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - { name: config, mountPath: /etc/quickwit }
          resources:
            {{- toYaml .Values.searcher.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: quickwit-config }
{{- end }}
