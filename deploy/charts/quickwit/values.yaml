image: quickwit/quickwit:0.9.1
# Everything on the S3 endpoint: the metastore is a file at
# s3://…/metastore and index splits at s3://…/indexes — no database needed.
metastoreUri: s3://quickwit/metastore
indexRootUri: s3://quickwit/indexes
storage:
  s3:
    endpoint: http://pgvs3:8014
    region: us-east-1
    force_path_style_access: true
    flavor: minio
    access_key_id: cachebench
    secret_access_key: cachebench-local-only
# One node runs every service. Split indexer/searcher roles need gossip
# between pods, which a Service VIP does not give you (chitchat's UDP to a
# ClusterIP never reaches a peer, so each node sees only itself — no shards,
# no metastore). Scale roles out later over pod DNS.
replicas: 1
enableOtlpEndpoint: true
# Tuning, passed straight into quickwit.yaml. Measured at 100M logs (see
# README): caches and split_cache did not move latency where storage is
# nearly free (warmups are ~13MB per split-search and pgvs3 serves cold ≈
# warm) — split_cache stays as cheap insurance for slow object storage. The
# lever for time-scoped log search is index layout: merged splits smear time
# ranges and every window pays per-split timestamp-column work, so
# `merge_policy: {type: no_merge}` kept 99.5% of fresh windowed queries
# under 20ms where stable_log merges managed 12%.
searcherConfig:
  split_cache:
    max_num_bytes: 20GiB
    max_num_splits: 64
    num_concurrent_downloads: 4
    max_file_descriptors: 256
# Ingest: the per-shard limit defaults to 5 MiB/s (validation caps it at
# 20 MiB); bulk loads need the headroom or they crawl on backpressure.
ingestApiConfig:
  shard_throughput_limit: 20MiB
  shard_burst_limit: 100MiB
resources:
  requests: { cpu: 500m, memory: 2Gi }
  limits: { memory: 16Gi }
