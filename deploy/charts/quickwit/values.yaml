image: quickwit/quickwit:0.9.1
# Same PostgreSQL cluster as pgvs3 and DuckLake, third logical database.
# The URI comes from a Secret; only immutable split files live on pgvs3.
metastoreSecretName: postgres
indexRootUri: s3://quickwit/indexes
storage:
  s3:
    endpoint: http://pgvs3:8014
    region: us-east-1
    force_path_style_access: true
    flavor: minio
    access_key_id: cachebench
    secret_access_key: cachebench-local-only
# One node runs the indexer/control plane and all services. The metastore can
# safely be shared through PostgreSQL; scale read-only searchers separately
# with direct pod discovery (never a ClusterIP seed).
# REST on 7280 includes the OTLP HTTP route;
# this release does not listen on 4317/4318. Split indexer/searcher roles need gossip
# between pods, which a Service VIP does not give you (chitchat's UDP to a
# ClusterIP never reaches a peer, so each node sees only itself — no shards,
# no metastore). Scale roles out later over pod DNS.
enableOtlpEndpoint: true
# Quickwit already caches fast fields, split footers and partial results in
# memory. Its optional whole-split cache is *disk-backed*: 20 GiB per searcher
# did not improve the measured 100M-log local kind run. Leave it off until an
# Aurora-backed A/B proves that the extra per-replica disk is worth it.
searcherConfig: {}
# Ingest: the per-shard limit defaults to 5 MiB/s (validation caps it at
# 20 MiB); bulk loads need the headroom or they crawl on backpressure.
ingestApiConfig:
  shard_throughput_limit: 20MiB
  shard_burst_limit: 100MiB
resources:
  requests: { cpu: 500m, memory: 2Gi }
  limits: { memory: 16Gi }
# The core is always one writer; only this search-only Deployment scales.
searcher:
  replicas: 0
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 6Gi }
