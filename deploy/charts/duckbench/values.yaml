replicas: 1
image: python:3.12-slim
pgHost: postgres
pgUser: postgres
pgPassword: postgres
# The thesis: Postgres + pgvs3 on one disk serves OTLP, OLAP and search.
# --hot-dbs vs --cold-dbs is the "spill to S3" story: everything hot is
# sub-20ms; large cold scans move to S3 over time without touching the hot
# majority.
hotDatabases:
  - pgvs3
  - ducklake_catalog
  - quickwit_metastore
# A second tier (e.g. a separate bucket/cluster) stands in for S3 spillover.
coldDatabase: ducklake_catalog_cold
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 4Gi }
