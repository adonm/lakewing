apiVersion: v1
kind: ConfigMap
metadata:
  name: duckbench
data:
  bench.py: |
    #!/usr/bin/env python3
    """Postgres + pgvs3: OLTP, OLAP (DuckLake) and search (Quickwit) on one disk.

    Emits JSON: per-query p50/p95/p99 and throughput for each workload, and
    the share of queries below 20ms — the number the architecture claims.
    """
    import json
    import os
    import statistics
    import sys
    import time
    import urllib.request

    PG_HOST = os.environ.get("PG_HOST", "postgres")
    PG_USER = os.environ.get("PG_USER", "postgres")
    PG_PASSWORD = os.environ.get("PG_PASSWORD", "postgres")
    QW = os.environ.get("QUICKWIT_URL", "http://quickwit:7280")

    def pct(xs, p):
        xs = sorted(xs)
        return xs[min(len(xs) - 1, int(len(xs) * p))] if xs else 0.0

    def report(name, latencies, extra=None):
        r = {
            "workload": name,
            "queries": len(latencies),
            "p50_ms": round(pct(latencies, 0.50), 3),
            "p95_ms": round(pct(latencies, 0.95), 3),
            "p99_ms": round(pct(latencies, 0.99), 3),
            "sub_20ms_pct": round(100.0 * sum(1 for x in latencies if x < 20.0) / max(len(latencies), 1), 1),
        }
        if extra:
            r.update(extra)
        print(json.dumps(r))
        return r

    def pg_query(db, sql, params=()):
        import psycopg
        t0 = time.perf_counter()
        with psycopg.connect(host=PG_HOST, user=PG_USER, password=PG_PASSWORD, dbname=db) as conn:
            conn.execute(sql, params)
        return (time.perf_counter() - t0) * 1000.0

    def oltp(db, n):
        lats = []
        for i in range(n):
            lats.append(pg_query(db, "SELECT * FROM s3p.objects WHERE bucket = $1 AND key = $2",
                                 ("lake", f"obj-{i:05}.bin")))
        return report("oltp.point_select", lats, {"note": db})

    def search(query, n):
        lats = []
        for _ in range(n):
            t0 = time.perf_counter()
            req = urllib.request.Request(f"{QW}/api/v1/_search?q={query}&max_hits=10")
            urllib.request.urlopen(req, timeout=30).read()
            lats.append((time.perf_counter() - t0) * 1000.0)
        return report("search.keyword", lats)

    def ducklake():
        """OLAP: DuckLake analytical query over pgvs3 (the S3-compatible data
        path) with a PostgreSQL catalog — the same stack as benchlib.connect."""
        import duckdb
        con = duckdb.connect()
        for ext in ("postgres", "httpfs", "ducklake"):
            con.sql(f"INSTALL {ext}")
            con.sql(f"LOAD {ext}")
        con.sql("SET s3_endpoint='pgvs3:8014'")
        con.sql("SET s3_use_ssl=false")
        con.sql("SET s3_url_style='path'")
        con.sql("SET s3_access_key_id='cachebench'")
        con.sql("SET s3_secret_access_key='cachebench-local-only'")
        con.sql(
            f"ATTACH 'ducklake:postgres:dbname=ducklake_catalog host={PG_HOST} "
            f"user={PG_USER} password={PG_PASSWORD}' AS lake (DATA_PATH 's3://lake/olap/')"
        )
        lats = []
        for _ in range(20):
            t0 = time.perf_counter()
            con.sql("SELECT count(*) FROM lake.hits").fetchall()
            lats.append((time.perf_counter() - t0) * 1000.0)
        return report("olap.ducklake_scan", lats)

    def main():
        results = []
        # OLTP: point selects against the object metadata.
        results.append(oltp("pgvs3", 200))
        # Search: Quickwit full-text over ingested OTLP-style logs.
        try:
            results.append(search("level:error AND service:checkout", 100))
        except Exception as e:
            print(json.dumps({"workload": "search.keyword", "error": str(e)}))
        # OLAP: DuckLake over pgvs3 with a PostgreSQL catalog.
        try:
            results.append(ducklake())
        except Exception as e:
            print(json.dumps({"workload": "olap.ducklake_scan", "error": str(e)}))
        hot = [r for r in results if r.get("p95_ms", 9e9) < 20.0]
        print(json.dumps({"hot_p95_under_20ms": len(hot) == len(results), "workloads": len(results)}))

    if __name__ == "__main__":
        main()
