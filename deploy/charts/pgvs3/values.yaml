replicas: 2
image: ghcr.io/adonm/pgvs3:latest
# Object rows and DuckLake's catalog live in this PostgreSQL; Quickwit's
# metastore is a file on the S3 endpoint (s3://quickwit/metastore).
url: postgres://postgres:postgres@postgres:5432/pgvs3
# Set to an existing Kubernetes Secret with key `url` for an external database
# (the EC2 kind rig uses Aurora). Keep credentials out of Helm values/history.
urlSecretName: ""
accessKey: cachebench
secretKey: cachebench-local-only
# Connection budget: the pool's ceiling is the gateway's share of a shared
# database, so name it here and keep it in postgres's connectionBudget.
poolMax: 64
poolMin: 64
# pgvs3 is stateless (metadata cache is per-process, keyed by bucket/key), so
# replicas scale reads linearly; writes are serialized in PostgreSQL. Requests
# are small so the stack schedules on a 16 GiB CI runner.
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 4Gi }
# Optional HPA: `just kind-stress` sweeps concurrency against a fixed replica
# count; enable this to watch scaling instead.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
