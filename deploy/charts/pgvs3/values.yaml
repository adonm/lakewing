replicas: 2
image: ghcr.io/adonm/pgvs3:latest
# Local kind uses the postgres chart's Secret; EC2 kind overrides this with
# Aurora's Secret. The URL never enters Helm values or release history.
urlSecretName: postgres
accessKey: cachebench
secretKey: cachebench-local-only
# A per-replica ceiling: 2 x 64 gateway connections. Size the local Postgres
# maxConnections (or external Aurora capacity) for the entire fleet.
poolMax: 64
poolMin: 64
# pgvs3 is stateless (metadata cache is per-process, keyed by bucket/key), so
# replicas scale reads linearly; writes are serialized in PostgreSQL. Requests
# are small so the stack schedules on a 16 GiB CI runner.
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 4Gi }
# Optional HPA; requires metrics-server (not installed in kind). Stress tests
# use fixed replicas so the concurrency sweep is repeatable.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
