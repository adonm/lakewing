apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvs3
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: pgvs3 }
  template:
    metadata:
      labels: { app: pgvs3 }
    spec:
      containers:
        - name: pgvs3
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGVS3_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.urlSecretName | quote }}, key: url }
            - name: PGVS3_ACCESS_KEY
              value: {{ .Values.accessKey | quote }}
            - name: PGVS3_SECRET_KEY
              value: {{ .Values.secretKey | quote }}
            - name: PGVS3_POOL_MAX
              value: {{ .Values.poolMax | quote }}
            - name: PGVS3_POOL_MIN
              value: {{ .Values.poolMin | quote }}
          ports: [{ containerPort: 8014, name: s3 }]
          # Starting a warm pool over TLS to Aurora can take longer than a
          # local kind connection. Do not apply liveness until it is serving.
          startupProbe:
            httpGet: { path: /healthz, port: 8014 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /healthz, port: 8014 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8014 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
