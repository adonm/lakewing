# Toolchain pins. The only prereq: `mise install` (auto-runs on first use).
# Services (Postgres, optional SeaweedFS origin) run via `just dev-db` / `just dev-origin` with Docker.
[tools]
just = "1"
rust = "stable"
uv = "0.12.1"
python = "3.12.14"
duckdb = "1.5.5"

# Python duckdb wheels for the TPC-H harness (the CLI pin is under [tools];
# this is the interpreter module the harness imports). Pinned per line so every
# host resolves identically: `just tpch` (stable) / `just tpch2` (2.0 pre).
# The dev-build pin is a date-stamped nightly; bump when 2.0 GA lands.
[env]
DUCKDB_PY_STABLE = "1.5.5"
DUCKDB_PY_PRE = "2.0.0.dev2609222040"
