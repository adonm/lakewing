# Toolchain pins: `mise install` (runs on first use). Local PostgreSQL runs
# in Docker via `just dev-db`.
[tools]
just = "1"
rust = "stable"
uv = "0.12.1"
python = "3.12.14"
duckdb = "1.5.5"

# Python duckdb wheels the benchmark harness imports (the CLI pin is under
# [tools]): stable for `just tpch`, the 2.0 pre-release for everything else.
# The pre-release pin is a date-stamped nightly; bump when 2.0 GA lands.
[env]
DUCKDB_PY_STABLE = "1.5.5"
DUCKDB_PY_PRE = "2.0.0.dev2609222040"
