# Toolchain pins: `mise install` before just recipes, both locally and on EC2.
# System packages only bootstrap Docker and native build prerequisites; mise
# owns Rust, the kind/Helm/kubectl tools and the Cargo build cache (mbx).
[tools]
just = "1"
rust = "stable"
mr-boxington = "1.17.0"
hk = "2.1.0"
uv = "0.12.1"
python = "3.12.14"
duckdb = "1.5.5"
kind = "0.33"
kubectl = "1"
helm = "4"

# Python duckdb wheels the benchmark harness imports (the CLI pin is under
# [tools]): stable for `just tpch`, the 2.0 pre-release for everything else.
# The pre-release pin is a date-stamped nightly; bump when 2.0 GA lands.
[env]
DUCKDB_PY_STABLE = "1.5.5"
DUCKDB_PY_PRE = "2.0.0.dev2609222040"
