[workspace]
resolver = "2"
members = ["crates/lakewing"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
# One release train, pinned together (see docs/rust-architecture.md):
# writer/reader vintages must match; 12.0.0 is the crates release of the
# rev our datasets were written with (pylance 12 / rev 356acb0).
lance = { version = "=12.0.0", features = ["aws", "geo"] }
lance-io = "=12.0.0"
lance-index = "=12.0.0"
lance-file = "=12.0.0"
lance-namespace = "=12.0.0"
lance-namespace-impls = "=12.0.0"
object_store = { version = "0.14", features = ["aws"] }
arrow = { version = "58", features = ["prettyprint"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
poem = "3.1"
duckdb = { version = "=1.10505.0", features = ["bundled", "appender-arrow"] }
foyer = "0.22"
bytes = "1"
anyhow = "1"
flate2 = "1"
parquet = { version = "58", features = ["arrow"] }
geoarrow-array = "0.8"
tonic = "0.14"
tokio-stream = "0.1"
arrow-flight = "58"
geoarrow-schema = "0.8"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[profile.release]
lto = "thin"
