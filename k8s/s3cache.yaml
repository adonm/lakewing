# s3cache DaemonSet: one read-through S3 slice cache per node.
# Readers point S3_ENDPOINT at the node-local address
# (http://$NODE_IP:8345) so every pod shares one NVMe copy.
# No CSI driver, no FUSE mounts: plain Deployments + hostPath.
#
# Auth: the proxy is the SOLE SigV4 signer. Create one secret for it:
#   kubectl -n lake create secret generic s3cache-auth \
#     --from-literal=key_id=$S3_USER --from-literal=secret=$S3_PASS
# Workers set only S3_ENDPOINT; their DuckDB secret is created without
# KEY_ID (anonymous to the proxy). Client credentials never travel
# upstream and never touch the cache key.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: s3cache
  namespace: lake
spec:
  selector:
    matchLabels:
      app: s3cache
  template:
    metadata:
      labels:
        app: s3cache
    spec:
      hostNetwork: true
      # hostNetwork pods inherit the node's resolv.conf; force cluster
      # DNS so the upstream Service name resolves.
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: s3cache
          image: lakewing-s3cache:latest
          args: ["s3cache"]
          ports:
            # Single listener: S3 with /healthz and /metrics on it.
            - name: s3
              containerPort: 8345
              hostPort: 8345
          env:
            - name: UPSTREAM
              value: "http://seaweed.lake:8333"
            - name: LISTEN
              value: ":8345"
            - name: CACHE_DIR
              value: /cache
            - name: CACHE_BYTES
              value: "10737418240"
            - name: SLICE_BYTES
              value: "1048576"
            - name: READAHEAD
              value: "4"
            # The proxy is the sole S3 signer: workers carry no S3
            # credentials at all. One Secret on the DaemonSet replaces
            # credentials in every reader pod.
            - name: S3_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3cache-auth
                  key: key_id
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: s3cache-auth
                  key: secret
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Fetch buffers are slice-sized x FETCHERS; the disk budget
              # (not RAM) holds the dataset subset. Raise with slice size.
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              port: 8345
              path: /healthz
            periodSeconds: 5
      volumes:
        - name: cache
          hostPath:
            path: /nvme/s3cache
            type: DirectoryOrCreate
