# Grafana Alloy: scrapes lakewing /metrics into Mimir and ships every
# pod's logs into Loki. Static scrape targets (no discovery RBAC needed
# for metrics); pod log shipping needs pod/namespace reads (below).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: alloy-logs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    prometheus.scrape "lakewing" {
      targets = [
        {"__address__" = "lake-read.lake.svc.cluster.local:3000", "pool" = "read"},
        {"__address__" = "lake-bulk.lake.svc.cluster.local:3000", "pool" = "bulk"},
      ]
      forward_to = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "15s"
      metrics_path = "/metrics"
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://lgtm.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.k8s.output
      forward_to = [loki.write.loki.receiver]
    }

    discovery.relabel "k8s" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.write "loki" {
      endpoint {
        url = "http://lgtm.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: podlogs
              mountPath: /var/log/pods
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy
          resources:
            requests:
              memory: 256Mi
              cpu: "0.2"
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: podlogs
          hostPath:
            path: /var/log/pods
        - name: storage
          emptyDir: {}
