# 2-AZ kind simulation: workers carry real topology zone labels and a
# node-local /nvme extraMount (the NVMe stand-in for s3cache local disk
# caches and the SeaweedFS backend).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lake
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-a
    extraMounts:
      - hostPath: /tmp/opencode/kind-nvme-a
        containerPath: /nvme
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-b
    extraMounts:
      - hostPath: /tmp/opencode/kind-nvme-b
        containerPath: /nvme
