apiVersion: v1
kind: ServiceAccount
metadata:
  name: cachebench-alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cachebench-alloy
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, "pods/log"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cachebench-alloy
subjects:
  - kind: ServiceAccount
    name: cachebench-alloy
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: cachebench-alloy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cachebench-alloy
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex = "lake-bench|mount-s3"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "service_name"
      }
    }
    loki.source.kubernetes "pods" {
      targets = discovery.relabel.pods.output
      forward_to = [loki.write.lgtm.receiver]
    }
    loki.write "lgtm" {
      endpoint {
        url = "http://lgtm.monitoring:3100/loki/api/v1/push"
      }
    }
    discovery.relabel "metrics" {
      targets = discovery.relabel.pods.output
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex = "metrics"
        action = "keep"
      }
    }
    prometheus.scrape "bench" {
      targets = discovery.relabel.metrics.output
      scrape_interval = "5s"
      scrape_timeout = "4s"
      forward_to = [prometheus.remote_write.lgtm.receiver]
    }
    prometheus.remote_write "lgtm" {
      endpoint {
        url = "http://lgtm.monitoring:9090/api/v1/write"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cachebench-alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: cachebench-alloy
  template:
    metadata:
      labels:
        app: cachebench-alloy
    spec:
      serviceAccountName: cachebench-alloy
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args: [run, /etc/alloy/config.alloy, "--storage.path=/var/lib/alloy", "--server.http.listen-addr=0.0.0.0:12345"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: state
              mountPath: /var/lib/alloy
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cachebench-alloy
        - name: state
          emptyDir: {}
