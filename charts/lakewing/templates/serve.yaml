apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-serve
  labels: &labels
    app.kubernetes.io/name: lakewing
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: serve
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --catalog-uri={{ .Values.serve.catalogUri }}
            - --table={{ .Values.serve.table }}
            - --tag={{ .Values.serve.tag }}
            - --listen={{ .Values.serve.listen }}
            - --concurrency={{ .Values.serve.concurrency }}
            - --duck-threads={{ .Values.serve.duckThreads }}
            - --duck-memory-mb={{ .Values.serve.duckMemoryMb }}
            - --response-cache-bytes={{ .Values.serve.responseCacheBytes }}
            {{- if .Values.serve.flightListen }}
            - --flight-listen={{ .Values.serve.flightListen }}
            {{- end }}
            {{- if .Values.serve.otelEndpoint }}
            - --otel-endpoint={{ .Values.serve.otelEndpoint }}
            {{- end }}
            {{- if .Values.serve.cacheDir }}
            - --cache-dir={{ .Values.serve.cacheDir }}
            - --cache-bytes={{ .Values.serve.cacheBytes }}
            - --cache-block-bytes={{ .Values.serve.cacheBlockBytes }}
            {{- end }}
            {{- if .Values.serve.endpoint }}
            - --endpoint={{ .Values.serve.endpoint }}
            {{- end }}
            {{- if .Values.serve.s3KeySecret }}
            - --s3-key=$(S3_KEY)
            - --s3-secret=$(S3_SECRET)
            {{- else if not .Values.serve.endpoint }}
            # No endpoint and no credentials: cloud S3 with ambient credentials.
            {{- end }}
          {{- if .Values.serve.s3KeySecret }}
          env:
            - name: S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serve.s3KeySecret }}
                  key: s3-key
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serve.s3KeySecret }}
                  key: s3-secret
          {{- end }}
          {{- if .Values.serve.cacheDir }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.serve.flightListen }}
            - name: flight
              containerPort: 50051
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            {{- if .Values.serve.cacheDir }}
            # Each pod gets its own directory under the node-local hostPath:
            # the foyer disk tier is single-process and must never be shared.
            - name: cache
              mountPath: {{ .Values.serve.cacheDir }}
              subPathExpr: $(POD_NAME)
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.serve.cacheDir }}
        - name: cache
          hostPath:
            path: {{ .Values.cacheHostPath }}
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: lakewing
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: lakewing
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: serve
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if .Values.serve.flightListen }}
    - name: flight
      port: 50051
      targetPort: flight
    {{- end }}
