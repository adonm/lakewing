{{- /* Dev-only single-node SeaweedFS S3 origin for kind
     (seaweed.enabled). Prod points s3.origin at real S3 instead.
     Credentials come from seaweed.keyID/secret (dev-only values, never
     for prod); the same pair must be provisioned into s3.authSecretName
     for the proxy and writer sidecars. */ -}}
{{- if .Values.seaweed.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakewing.fullname" . }}-seaweed
spec:
  selector:
    app: {{ include "lakewing.fullname" . }}-seaweed
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakewing.fullname" . }}-seaweed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "lakewing.fullname" . }}-seaweed
  template:
    metadata:
      labels:
        app: {{ include "lakewing.fullname" . }}-seaweed
    spec:
      containers:
        - name: seaweed
          image: {{ .Values.seaweed.image }}
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/config/s3.json
          ports:
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "lakewing.fullname" . }}-seaweed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lakewing.fullname" . }}-seaweed
data:
  s3.json: {{ printf `{"identities": [{"name": "bench", "actions": ["Admin"], "credentials": [{"accessKey": "%s", "secretKey": "%s"}]}]}` .Values.seaweed.keyID .Values.seaweed.secret | quote }}
{{- end }}
