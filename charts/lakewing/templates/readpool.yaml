{{- /* One Deployment per zone behind a shared Service. Each pod pins to the
     concrete catalog in .Values.s3.catalog and reads it plus Parquet files
     over S3_DIRECT through its node's s3cache proxy (--shard/--data-root
     are s3:// URLs; S3_ENDPOINT points at the node-local proxy and the
     proxy is the sole SigV4 signer, so readers carry no credentials).
     Readers wait for the first publish instead of crash-looping. */ -}}
{{- $shard := printf "s3://%s/catalogs/%s" .Values.s3.bucket .Values.s3.catalog }}
{{- $data := printf "s3://%s/%s/" .Values.s3.bucket .Values.s3.dataPrefix }}
{{- range $zone := .Values.zones }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakewing.fullname" $ }}-read-{{ $zone }}
spec:
  replicas: {{ $.Values.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "lakewing.fullname" $ }}-read
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "lakewing.fullname" $ }}-read
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      initContainers:
        - name: wait-for-publish
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "until wget -q -O /dev/null \"$S3_ENDPOINT/{{ $.Values.s3.bucket }}/catalogs/{{ $.Values.s3.catalog }}\"; do sleep 5; done"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: S3_ENDPOINT
              value: http://$(NODE_IP):{{ $.Values.s3cache.port }}
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec lakewing serve --shard '{{ $shard }}' --data-root '{{ $data }}' --listen 0.0.0.0:3000 --temp-dir /duckdb-temp
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: S3_ENDPOINT
              value: http://$(NODE_IP):{{ $.Values.s3cache.port }}
          volumeMounts:
            - name: duckdb-temp
              mountPath: /duckdb-temp
          resources: {{ toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: duckdb-temp
          emptyDir:
            sizeLimit: {{ $.Values.temp.sizeLimit }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakewing.fullname" . }}-read
spec:
  selector:
    app: {{ include "lakewing.fullname" . }}-read
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
