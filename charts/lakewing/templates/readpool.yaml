{{- /* One Deployment per zone behind a shared Service. Each pod pins to the
     concrete catalog in .Values.catalog and reads it plus Parquet files
     from the node-local mountpoint-S3-CSI mount (--shard/--data-root are
     mount paths). Readers wait for the first publish instead of
     crash-looping. */ -}}
{{- $mount := .Values.csi.mountPath }}
{{- $shard := printf "%s/catalogs/%s" $mount .Values.catalog }}
{{- $data := printf "%s/%s/" (trimSuffix "/" $mount) .Values.dataPrefix }}
{{- range $zone := .Values.zones }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakewing.fullname" $ }}-read-{{ $zone }}
spec:
  replicas: {{ $.Values.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "lakewing.fullname" $ }}-read
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "lakewing.fullname" $ }}-read
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      initContainers:
        - name: wait-for-publish
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "until test -f '{{ $shard }}'; do sleep 5; done"]
          volumeMounts:
            - name: lake
              mountPath: {{ $mount }}
              readOnly: true
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec lakewing serve --shard '{{ $shard }}' --data-root '{{ $data }}' --listen 0.0.0.0:3000 --temp-dir /duckdb-temp
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: lake
              mountPath: {{ $mount }}
              readOnly: true
            - name: duckdb-temp
              mountPath: /duckdb-temp
          resources: {{ toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: {{ include "lakewing.fullname" $ }}-lake
        - name: duckdb-temp
          emptyDir:
            sizeLimit: {{ $.Values.temp.sizeLimit }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakewing.fullname" . }}-read
spec:
  selector:
    app: {{ include "lakewing.fullname" . }}-read
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
