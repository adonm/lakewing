{{- if .Values.writer.enabled }}
{{- /* Optional single writer (the only component allowed to mutate refs):
     hourly build of a new immutable snapshot into scratch, upload of data
     + catalog to S3, then the ref move. Disabled by default.
     The build stores a zone-independent s3:// DATA_PATH; readers serve it
     over S3_DIRECT through their node's s3cache proxy.
     Uploads are additive (copy, never sync/delete); catalog keys
     are never overwritten (the job fails if the key exists). */ -}}
{{- $wzone := .Values.zones | first }}
{{- $endpoint := .Values.s3.origin | default .Values.s3endpoint }}
{{- if and (not $endpoint) .Values.seaweed.enabled }}{{ $endpoint = printf "http://%s-seaweed:8333" (include "lakewing.fullname" .) }}{{ end }}
{{- $endpoint = $endpoint | default "http://seaweedfs:8333" }}
{{- $secret := .Values.s3.authSecretName | default .Values.s3secret | default "lake-s3" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lakewing.fullname" . }}-writer
spec:
  schedule: {{ .Values.writer.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/zone
                        operator: In
                        values: ["{{ $wzone }}"]
          initContainers:
            - name: build
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  sha="sha_$(date -u +%Y%m%dT%H%M)"
                  printf '%s' "$sha.ducklake" > /stage/catalog-name
                  lakewing build --bbox={{ .Values.writer.bbox }} \
                    --limit {{ .Values.writer.limit }} \
                    --collection {{ .Values.writer.collection }} \
                    --content-address \
                    --out "/stage/$sha.ducklake" \
                    --data-dir /stage/files \
                    --data-url 's3://{{ .Values.s3.bucket }}/{{ .Values.s3.dataPrefix }}/'
              volumeMounts:
                - name: stage
                  mountPath: /stage
          containers:
            - name: publish
              image: rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command:
                - sh
                - -c
                - |
                  set -eu
                  name=$(cat /stage/catalog-name)
                  if rclone lsf "lake:{{ .Values.s3.bucket }}/catalogs/" 2>/dev/null | grep -qx "$name"; then
                    echo "catalog key $name already published; refusing to overwrite" >&2
                    exit 1
                  fi
                  # Additive only: never delete data another snapshot references.
                  # Content-addressed names make unchanged snapshots upload
                  # nothing new (rclone skips existing keys).
                  rclone copy /stage/files "lake:{{ .Values.s3.bucket }}/{{ .Values.s3.dataPrefix }}/"
                  rclone copyto "/stage/$name" "lake:{{ .Values.s3.bucket }}/catalogs/$name"
                  rclone copyto "/stage/$name.serving.json" "lake:{{ .Values.s3.bucket }}/catalogs/$name.serving.json"
                  rclone rcat "lake:{{ .Values.s3.bucket }}/refs/latest" < /stage/catalog-name
                  echo "published $name"
              env:
                - name: RCLONE_CONFIG_LAKE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_LAKE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_LAKE_ENDPOINT
                  value: {{ $endpoint | quote }}
                - name: RCLONE_CONFIG_LAKE_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_LAKE_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_LAKE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_LAKE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: stage
                  mountPath: /stage
          volumes:
            - name: stage
              emptyDir: {}
{{- end }}
