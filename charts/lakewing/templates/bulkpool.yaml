{{- /* Dedicated bulk pool: same catalog and CSI mount as the interactive
     pool, but uncapped bulk concurrency and its own replicas/resources so
     broad scans and Flight exports never starve small pages. Exposes HTTP
     and Flight. Disabled by default (see values.bulk). */ -}}
{{- if .Values.bulk.enabled }}
{{- $mount := .Values.csi.mountPath }}
{{- $shard := printf "%s/catalogs/%s" $mount .Values.catalog }}
{{- $data := printf "%s/%s/" (trimSuffix "/" $mount) .Values.dataPrefix }}
{{- range $zone := .Values.zones }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakewing.fullname" $ }}-bulk-{{ $zone }}
spec:
  replicas: {{ $.Values.bulk.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "lakewing.fullname" $ }}-bulk
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "lakewing.fullname" $ }}-bulk
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec lakewing serve --shard '{{ $shard }}' --data-root '{{ $data }}' --listen 0.0.0.0:3000 --flight-listen 0.0.0.0:50051 --connections {{ $.Values.bulk.connections }} --flight-concurrency {{ $.Values.bulk.flightConcurrency }} --temp-dir /duckdb-temp
          ports:
            - name: http
              containerPort: 3000
            - name: flight
              containerPort: 50051
          volumeMounts:
            - name: lake
              mountPath: {{ $mount }}
              readOnly: true
            - name: duckdb-temp
              mountPath: /duckdb-temp
          resources: {{ toYaml $.Values.bulk.resources | nindent 12 }}
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: {{ include "lakewing.fullname" $ }}-lake
        - name: duckdb-temp
          emptyDir:
            sizeLimit: {{ $.Values.temp.sizeLimit }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakewing.fullname" . }}-bulk
spec:
  selector:
    app: {{ include "lakewing.fullname" . }}-bulk
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: flight
      port: 50051
      targetPort: flight
{{- end }}
