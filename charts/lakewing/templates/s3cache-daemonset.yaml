{{- /* Node-local read-through S3 slice cache: one pod per node on NVMe
     hostPath, sharing one disk copy across every reader pod on the node.
     The proxy is the sole SigV4 signer (S3_KEY_ID/S3_SECRET from
     s3.authSecretName); readers carry no credentials. See docs/s3cache.md. */ -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lakewing.fullname" . }}-s3cache
spec:
  selector:
    matchLabels:
      app: {{ include "lakewing.fullname" . }}-s3cache
  template:
    metadata:
      labels:
        app: {{ include "lakewing.fullname" . }}-s3cache
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: s3cache
          image: {{ .Values.s3cache.image.repository }}:{{ .Values.s3cache.image.tag }}
          imagePullPolicy: {{ .Values.s3cache.image.pullPolicy }}
          args: ["s3cache"]
          ports:
            - name: s3
              containerPort: {{ .Values.s3cache.port }}
              hostPort: {{ .Values.s3cache.port }}
            - name: metrics
              containerPort: 8080
          env:
            - name: UPSTREAM
              value: {{ .Values.s3.origin | default (printf "http://%s-seaweed:8333" (include "lakewing.fullname" .)) | quote }}
            - name: LISTEN
              value: {{ printf ":%d" (.Values.s3cache.port | int) | quote }}
            - name: CACHE_DIR
              value: /cache
            - name: CACHE_BYTES
              value: {{ .Values.s3cache.cacheBytes | quote }}
            - name: SLICE_BYTES
              value: {{ .Values.s3cache.sliceBytes | quote }}
            - name: READAHEAD
              value: {{ .Values.s3cache.readahead | quote }}
            - name: S3_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.authSecretName is required (keys: key_id, secret)" .Values.s3.authSecretName }}
                  key: key_id
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.authSecretName }}
                  key: secret
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources: {{ toYaml .Values.s3cache.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              port: s3
              path: /healthz
            periodSeconds: 5
      volumes:
        - name: cache
          hostPath:
            path: /nvme/s3cache
            type: DirectoryOrCreate
