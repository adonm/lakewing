{{- /* Static-provisioned mountpoint-S3-CSI volume for the lake bucket.
     Readers mount this; writers never mount (direct S3 writes).
     Disabled for kind (csi.enabled=false), where the PVC is hostPath. */ -}}
{{- if .Values.csi.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "lakewing.fullname" . }}-lake
spec:
  capacity:
    storage: 1200Gi
  storageClassName: {{ .Values.csi.storageClass | quote }}
  claimRef:
    name: {{ include "lakewing.fullname" . }}-lake
    namespace: {{ .Release.Namespace }}
  accessModes:
    - ReadOnlyMany
  mountOptions:
    - allow-other
    {{- range .Values.csi.mountOptions }}
    - {{ . | quote }}
    {{- end }}
    {{- if .Values.csi.prefix }}
    - {{ printf "prefix %s" .Values.csi.prefix | quote }}
    {{- end }}
  csi:
    driver: {{ .Values.csi.driver }}
    volumeHandle: {{ .Values.csi.volumeHandle }}
    volumeAttributes:
      bucketName: {{ .Values.s3bucket }}
      authenticationSource: {{ .Values.csi.authenticationSource }}
      {{- if eq .Values.csi.cache.type "emptyDir" }}
      cache: emptyDir
      cacheEmptyDirSizeLimit: {{ .Values.csi.cache.size | quote }}
      {{- else if eq .Values.csi.cache.type "ephemeral" }}
      cache: ephemeral
      cacheEphemeralStorageClassName: {{ required "csi.cache.storageClass is required for ephemeral cache" .Values.csi.cache.storageClass | quote }}
      cacheEphemeralStorageResourceRequest: {{ .Values.csi.cache.size | quote }}
      {{- else if .Values.csi.cache.type }}
      {{- fail "csi.cache.type must be emptyDir, ephemeral, or empty to disable" }}
      {{- end }}
      {{- if .Values.csi.storageSecretName }}
      csi.storageSecretName: {{ .Values.csi.storageSecretName }}
      {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lakewing.fullname" . }}-lake
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: {{ .Values.csi.storageClass | quote }}
  resources:
    requests:
      storage: 1200Gi
  volumeName: {{ include "lakewing.fullname" . }}-lake
{{- end }}
