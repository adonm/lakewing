# Default values for lakewing.
replicaCount: 2

image:
  repository: ghcr.io/adonm/lakewing
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

serve:
  # Catalog of record (Lance Namespace directory root) and pin.
  catalogUri: s3://lake/catalog
  table: features
  tag: prod
  listen: 0.0.0.0:3000
  # S3 access: endpoint (node-local gateway or direct) plus either static
  # credentials from an existing secret or unsigned reads (gateway signs).
  endpoint: ""          # e.g. http://s3-gateway:8080 (empty = cloud S3)
  s3KeySecret: ""       # existing secret name with s3-key / s3-secret keys
  # Admission: HTTP + Flight share these permits; saturation rejects fast
  # (HTTP 429 + Retry-After, Flight RESOURCE_EXHAUSTED).
  concurrency: 4
  duckThreads: 1        # DuckDB worker threads per permit
  duckMemoryMb: 512     # per-process DuckDB memory limit
  # Optional Arrow Flight port (read-only; shares admission).
  flightListen: ""
  # Optional OTLP/gRPC trace collector (e.g. http://lgtm:4317).
  otelEndpoint: ""
  # Node-local NVMe range cache; one directory per pod (see templates).
  cacheDir: /nvme/lakewing
  cacheBytes: "8589934592"  # 8 GiB disk tier
  # Block alignment for immutable ranges: overlapping queries reuse cached
  # bytes (0 = exact ranges).
  cacheBlockBytes: "262144"  # 256 KiB
  # Rendered-response cache (opt-in; the default posture optimizes serving
  # over cached data instead of caching rendered responses).
  responseCacheBytes: "0"

# Node-local parent directory; each pod gets <path>/<pod-name> so the
# single-process foyer disk tiers never share files.
cacheHostPath: /mnt/nvme/lakewing

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

nodeSelector: {}
tolerations: []
affinity: {}
