# Read pool over S3 via the node-local s3cache proxy. Readers hold no S3
# credentials: the proxy is the sole SigV4 signer. Writes
# (build/publish) go direct to S3.
image:
  repository: lakewing
  tag: latest
  pullPolicy: IfNotPresent

# One Deployment per zone behind a shared Service; each pod serves the
# pinned catalog over S3_DIRECT through its node's s3cache proxy.
replicasPerZone: 1
zones:
  - az-a
  - az-b
resources: {}
#  requests:
#    memory: 5Gi
#    cpu: "2"

service:
  port: 3000

# S3 origin holding catalogs/, data/ and refs/. Readers address it
# through the node-local s3cache DaemonSet (S3_ENDPOINT); only the
# writer and the proxy talk to the origin over the API.
s3:
  bucket: lake
  # Concrete published catalog readers pin to (restart/rollout to move).
  # Written by the seed job or the writer; see refs/ in S3 for history.
  catalog: sha_berlin.ducklake
  # Key prefix holding the immutable Parquet data files. The published
  # catalog stores `s3://<bucket>/<dataPrefix>/` as its DATA_PATH.
  dataPrefix: data
  # Origin base URL for the writer and the s3cache proxy. Empty + 
  # seaweed.enabled uses the in-chart dev SeaweedFS.
  origin: ""
  # Secret holding S3 credentials (keys: key_id, secret for the proxy;
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for the writer sidecar).
  authSecretName: ""

# Node-local read-through S3 slice cache (one pod per node, NVMe
# hostPath, bounded hot subset of the lake). See docs/s3cache.md.
s3cache:
  image:
    repository: lakewing-s3cache
    tag: latest
    pullPolicy: IfNotPresent
  cacheBytes: "10737418240"
  sliceBytes: "1048576"
  readahead: "4"
  port: 8345
  resources: {}
#  requests:
#    memory: 128Mi
#    cpu: 100m

# Dev-only single-node SeaweedFS origin for kind. Disabled in prod,
# where s3.origin points at real S3.
seaweed:
  enabled: false
  image: chrislusf/seaweedfs:4.13
  keyID: dev
  secret: dev-local-only

# DuckDB spill space: ephemeral emptyDir (counts against the pod's
# ephemeral-storage quota and evicts with it — size for worst-case sorts,
# not the dataset). Mounted at /duckdb-temp and passed as --temp-dir so
# pressure spills to node-local disk instead of the container layer.
temp:
  sizeLimit: 10Gi

# S3 endpoint + Secret for the writer/seed direct-write sidecars.
# Defaults address the local SeaweedFS rig (see just seaweed-up); point at
# real S3 in prod. These default into s3.origin / s3.authSecretName below.
s3endpoint: ""
s3secret: ""

# Dedicated bulk pool (Flight + heavy OGC) pinned to the same catalog.
# Disabled by default: enable when bulk scans threaten interactive pages.
bulk:
  enabled: false
  replicasPerZone: 1
  flightConcurrency: 0
  connections: 4
  resources: {}

# Optional single writer: hourly build + S3 upload + ref move (the ETL
# publisher). The only component allowed to mutate refs. Needs the S3
# Secret for direct writes.
writer:
  enabled: false
  schedule: "0 * * * *"
  bbox: 13.35,52.48,13.45,52.55
  limit: 20000
  collection: buildings
